<!DOCTYPE html>
<html lang="ko" data-app="field" data-build="pwa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E5EFF">
  <meta name="description" content="TS 보안컨설팅 현장 기록 앱(인터넷 없이 동작)">
  <title>TS현장</title>
  <!-- B안(기본): 외부 정적 주소 PWA. 고객 정보가 없는 빈 앱이며 프로젝트 자료는 *.tspack 으로 불러온다(D75).
       A안(보조): build_single.py 가 이 파일을 HTML 하나로 묶고 아래 ts-app-data 에 앱 자료를 넣는다.
       외부 글꼴·라이브러리·CDN·네트워크 호출 없음. -->
  <link rel="manifest" href="manifest.webmanifest" data-pwa-only>
  <link rel="icon" href="assets/app_icon_192.png">
  <link rel="apple-touch-icon" href="assets/app_icon_192.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="top" id="top"></header>
    <main id="main"></main>
    <nav class="tabs" id="tabs" hidden></nav>
  </div>
  <div class="saved" id="saved">저장됨</div>
  <div id="layer"></div>

  <!-- 촬영·파일 입력(5-5). 사진·동영상은 카메라를 바로 연다 -->
  <input type="file" id="inPhoto" accept="image/*" capture="environment" hidden>
  <input type="file" id="inVideo" accept="video/*" capture="environment" hidden>
  <input type="file" id="inGallery" accept="image/*,video/*" multiple hidden>
  <input type="file" id="inTest" accept="image/*" capture="environment" hidden>
  <input type="file" id="inPack" accept=".tspack,application/json,.json" hidden>

  <!-- 앱 자료 ts-field-app-data/1(5-7). B안에서는 비어 있다 -->
  <script type="application/json" id="ts-app-data"></script>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/bundle.js"></script>
  <script src="js/media.js"></script>
  <script src="js/selfcheck.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
